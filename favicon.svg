<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Engineering Gauge Accent Ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>
  <!-- Monogram Logo ZA -->
  <text x="32" y="39" font-family="'Space Grotesk', 'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-1">ZA</text>
  <!-- Status Indicator Dot -->
  <circle cx="48" cy="18" r="3" fill="#10b981"/>
</svg>